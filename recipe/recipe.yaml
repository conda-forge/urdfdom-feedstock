schema_version: 1

context:
  name: urdfdom
  version: "6.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ros/${{ name }}/archive/${{ version }}.tar.gz
  sha256: 47e26b6553afe8bb49cc675a5209fb9f2feb91ab9310360f8015d4cb98cc094a

build:
  number: 1

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - if: unix
      then: make
  host:
    - console_bridge
    - tinyxml2
    - urdfdom_headers >=3.0.1
  run:
    - ${{ pin_compatible('urdfdom_headers', upper_bound='x') }}
  run_exports:
    # See https://github.com/ros/urdfdom/issues/220#issuecomment-4286125127
    - ${{ pin_compatible('urdfdom_headers', upper_bound='x') }}
    - ${{ pin_subpackage('urdfdom', upper_bound='x') }}

tests:
  - files:
      recipe:
        - test
    requirements:
      run:
        - pkg-config
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ninja
        - cmake
    script:
      - pkg-config --modversion ${{ name }}
      - pkg-config --exists --print-errors --debug ${{ name }}
      - pkg-config --validate --print-errors --debug ${{ name }}
      - if: unix
        then: test -f $PREFIX/lib/lib${{ name }}_model${SHLIB_EXT}
      - if: win
        then: if exist %PREFIX%\\Library\\lib\\urdfdom\\cmake\\urdfdom-config.cmake (exit 0) else (exit 1)

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: URDF parser
  homepage: http://github.com/ros/urdfdom
  repository: https://github.com/ros/urdfdom

extra:
  recipe-maintainers:
    - traversaro
    - jcarpent
    - wolfv
    - seanyen
